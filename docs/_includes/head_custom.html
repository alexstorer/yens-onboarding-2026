<!-- Source Sans 3 / Serif 4 / Code Pro — the lecture deck's families, under
     their current names (the legacy "Source Sans Pro" / "Source Serif Pro"
     names no longer resolve anywhere). Only the weights the stylesheet
     actually asks for, so this stays one small request. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@600;700&display=swap">

<link rel="stylesheet" href="{{ '/assets/css/course.css' | relative_url }}">

<script src="{{ '/assets/js/bonus-collapse.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/personalize.js' | relative_url }}" defer></script>

{% if page.redirect_to %}
<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
{% endif %}
